aid: 4k-garden
name: 4K Garden
description: >-
  4K Garden (4K花园), legally Sikai Garden Network Technology (Guangzhou) Co., Ltd.
  (四开花园网络科技（广州）有限公司), is a Chinese ultra-high-definition video technology
  company founded in 2016 and headquartered in Guangzhou, Guangdong, with roughly 200
  staff across Guangzhou and Beijing. It produces, aggregates and distributes 4K and 8K
  content, was among the first in China to run end-to-end UHD HDR live production over
  the public internet and 5G, operates large outdoor naked-eye 3D LED landmarks, builds
  8K 3D VR capture systems and domestically-sourced UHD broadcast trucks, and sells 5G
  video ringtone services with the three national carriers. Its AI product, Diebian AI
  (蝶变 AI), is a credit-metered video super-resolution platform at fly4k.com, and is the
  only part of the business with a machine-readable API contract.
