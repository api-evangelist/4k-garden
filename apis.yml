x-notes:
  website_correction: >-
    This record was harvested from a Nasdaq Private Market secondary-market venue
    listing, which left https://www.nasdaqprivatemarket.com/ standing as the company
    Website pointer. That is the trading venue, not 4K Garden. Corrected on 2026-09-05
    to the company's own site, https://www.4kgarden.com/ (HTTP 200).
  pointers_deliberately_absent: >-
    No DeveloperPortal, Documentation, APIReference, GettingStarted, Support, SignUp,
    Pricing, TermsOfService, PrivacyPolicy, GitHubOrganization, Roadmap or Postman
    pointer is emitted, because 4K Garden publishes none of these pages. No WellKnown or
    SecurityTxt pointer is emitted: every /.well-known/ path 404s on all five hosts
    probed (see well-known/4k-garden-well-known.yml). No AgentCard pointer is emitted:
    no agent card was found. No SDKs pointer is emitted: no client library exists in any
    registry. No MCPServer pointer is emitted: mcp/4k-garden-mcp.yml is a DERIVED
    candidate with deployment.mode none, and claiming a server that nobody ships would
    be false. No Idempotency pointer is emitted: idempotency coverage on this API is
    none, across all 43 mutating operations.
  host_reachability: >-
    4kgarden.com and www.4kgarden.com are served from mainland China and are slow from
    US networks - individual requests intermittently time out at 25-60s and succeed on
    retry. Timeouts recorded during probing are latency, not absence; every pointer above
    was confirmed HTTP 200.
