apis:
- name: Diebian AI Super-Resolution API
  description: >-
    Backend API for Diebian AI (蝶变 AI), 4K Garden's credit-metered video
    super-resolution platform. Covers authentication, customer accounts and prepaid
    credit balances, super-resolution task submission and tracking, output download,
    a commercial (TVC) production task surface, and enterprise team administration.
    The OpenAPI is springdoc-generated and served publicly without credentials, but
    4K Garden publishes no developer portal, reference or authentication documentation
    for it - so it is a publicly-served first-party contract rather than a documented
    developer programme.
  image: http://m.4kgarden.com/images/logo.png
